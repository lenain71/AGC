<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080a1a">
    <title>Chasse aux citrouilles — Hallo' Village</title>
    <link rel="icon" href="picto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="plein-ecran">
    <div id="carte"></div>

    <section class="phrase" id="phrase" aria-live="polite">
        <div class="phrase-tete"><span>La phrase secrète</span><span><b id="compteur"></b></span></div>
        <div class="phrase-mots" id="mots"></div>
    </section>

    <div class="gps" id="gps"><span class="point"></span><span id="gps-texte">Recherche GPS…</span></div>
    <div class="jeu-actions">
        <button class="rond sonar" id="sonar" hidden aria-label="Cri de chauve-souris (radar)"><span aria-hidden="true">🦇</span><b id="sonar-reste"></b></button>
        <button class="rond" id="enigmes" hidden aria-label="Relire les énigmes"><i class="fa-solid fa-scroll"></i></button>
        <button class="rond" id="voir-tout" aria-label="Voir tout le parcours"><i class="fa-solid fa-expand"></i></button>
        <button class="rond" id="recentrer" aria-label="Me recentrer"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>
    <div class="debug-panneau" id="debug" hidden></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/carte.js"></script>
    <script src="js/nuit.js"></script>
    <script src="js/jeu.js"></script>
</body>
</html>
