<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080a1a">
    <title>Parcours des citrouilles — admin</title>
    <link rel="icon" href="picto.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="plein-ecran admin-parcours">
    <div id="carte"></div>

    <section class="ap-haut">
        <nav class="ap-onglets" id="onglets" aria-label="Parcours"></nav>
        <div class="ap-resume" id="resume"></div>
    </section>

    <div class="ap-viseur" aria-hidden="true"><i class="fa-solid fa-plus"></i></div>
    <div class="gps" id="gps"><span class="point"></span><span id="gps-texte">Recherche GPS…</span></div>
    <div class="jeu-actions">
        <button class="rond" id="fond" aria-label="Changer le fond de carte"><i class="fa-solid fa-map"></i></button>
        <button class="rond" id="voir-tout" aria-label="Voir tout le parcours"><i class="fa-solid fa-expand"></i></button>
        <button class="rond" id="recentrer" aria-label="Me recentrer"><i class="fa-solid fa-location-crosshairs"></i></button>
    </div>

    <nav class="ap-barre" aria-label="Actions">
        <button id="ajout-gps"><i class="fa-solid fa-location-dot"></i><span>Ici (GPS)</span></button>
        <button id="ajout-viseur"><i class="fa-solid fa-crosshairs"></i><span>Au viseur</span></button>
        <button id="secret"><i class="fa-solid fa-ghost"></i><span>Secret</span></button>
        <button id="phrase"><i class="fa-solid fa-font"></i><span>Phrase</span></button>
        <button id="exporter"><i class="fa-solid fa-file-export"></i><span>Fichier</span></button>
    </nav>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/carte.js"></script>
    <script src="js/admin-parcours.js"></script>
</body>
</html>
